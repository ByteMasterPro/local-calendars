# Village at Leesburg events, read from villageatleesburg.com/events/.
#
# The site is Wix and renders entirely in JavaScript, so a plain fetch gets nothing and CI
# cannot refresh it: these are curated. Re-read the page when Christopher asks or at the start
# of a season.
#
# Their weekly tenant promotions (bargain movie Tuesdays, football at Anchor Bar, Friday live
# music) are tagged `routine`, which ranks them last in the digest's Town Activities and keeps
# them out of Top Picks. Real events carry their own tags.

