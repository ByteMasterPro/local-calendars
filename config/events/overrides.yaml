# Details read off event artwork (run `uv run localcal posters`, look at the images, write here).
# Venues routinely put the good stuff only in the poster: Honor's Fall Fest lists "20 vendors,
# axe throwing, petting zoo" in the image and nothing but a vendor list in the event text.
#
#   match:    regex against the event title (case-insensitive)
#   calendar: optional, must appear in the calendar name
#   on:       optional YYYY-MM-DD, pins this to one occurrence of a repeating title
#   details:  replaces the feed's blurb in the digest
#   source:   where it came from, so a later reader can re-check

events:
  - match: "Anniversary Fall Festival|Fall ?Fest"
    calendar: Honor Brewing
    details: >-
      Honor Brewing's 3rd anniversary party: 20 vendors, axe throwing and a petting zoo,
      plus live music from LeRoy Burks & The Voodoo Whiskey Band in the evening.
    source: event poster, read 2026-10-06

  - match: "Hallowee?[nm] Pop-?Up Bar"
    calendar: Honor Brewing
    details: >-
      Halloween pop-up bar running all October: festive cocktails served in collectable
      glassware, spooky decor throughout the taproom.
    source: event poster, read 2026-10-06

  - match: "Freaky Friday.*Shrek"
    calendar: Honor Brewing
    details: >-
      Outdoor movie night on the lawn: Shrek. Their October poster says a 7:30 start, their
      calendar says 7pm. Bring chairs and blankets.
    source: event poster, read 2026-10-06

  # From Honor's October 2026 month-at-a-glance poster (Instagram @honorbrewingcompany, Oct 1).
  # It carries times and detail their calendar feed leaves out.
  - match: "Freaky Friday.*Jurassic Park"
    calendar: Honor Brewing
    details: "Outdoor movie night on the lawn: Jurassic Park, 7pm."
    source: Instagram October 2026 schedule, read 2026-10-06

  - match: "Freaky Friday.*Harry Potter"
    calendar: Honor Brewing
    details: "Outdoor movie night on the lawn: Harry Potter and the Sorcerer's Stone, 7pm."
    source: Instagram October 2026 schedule, read 2026-10-06

  - match: "Truc?k.or.Treat"
    calendar: Honor Brewing
    details: "Trunk-or-treat: a safe, family trick-or-treat event in the lot, 11am to 1pm."
    source: Instagram October 2026 schedule, read 2026-10-06

  - match: "Pumpkin Ain.t Easy Pint Night"
    calendar: Honor Brewing
    details: "Pumpkin pint night from 4pm: a free pint glass with any food purchase."
    source: Instagram October 2026 schedule, read 2026-10-06

  - match: "Halloween Costume Party"
    calendar: Honor Brewing
    details: >-
      Halloween costume party, 6pm to 11pm: DJ from 6 to 10, a tarot card reader, the Halloween
      pop-up bar, and cash prizes for best costume - first prize is $250 plus an annual mug club
      membership (worth $300) and a Halloween pop-up t-shirt.
    source: Instagram event poster, read 2026-10-06

  - match: "October Charity Tap Line"
    calendar: Honor Brewing
    details: "Charity tap line night supporting Food on the Stove, 4pm to 8pm."
    source: Instagram October 2026 schedule, read 2026-10-06

  - match: "First Friday: Live Music"
    calendar: Honor Brewing
    details: >-
      October First Friday: Twisted Flags play 6 to 9pm, with local vendors 5 to 8pm and an
      extended happy hour from 3 to 6pm.
    source: Instagram October 2026 schedule, read 2026-10-06

# Offers and announcements seen on a venue's Instagram whose detail is caption-only. We never
# log in, so instead of guessing a date or inventing a code, the digest points at the app.
#   kind:      brewery (default) | town | festival - which section it appears under
#   until:     last day to show it; leave out for "until someone removes it"
#   instagram: handle, rendered as a link
#
# A real example of the shape (expired, kept to show the pattern): White's Ferry announced the
# Leesburg Fall Festival across two posts - the first carried the date, the follow-up added
# "20% OFF: Wine Flights - Fall Beer - Pretzel" and "More Details In Caption".
#
# notices:
#   - venue: White's Ferry
#     kind: brewery
#     until: 2026-10-03
#     instagram: whitesferrybrew
#     text: >-
#       20% off wine flights, fall beer and pretzels during the Fall Festival. The code is in
#       their Instagram caption.
notices: []
