# Fairs, festivals, carnivals and seasonal farm events near Leesburg, VA that nobody publishes
# a feed for. Hand-curated: add what you find (see localcal/sources/manual.py for the format).
# Every entry here was checked against the organizer's own site or a government listing on the
# date in `verified`. Re-verify dates each season; organizers move them.
#
#   start/end:  a date = all-day (end is the inclusive last day); "YYYY-MM-DD HH:MM" = timed
#   season:     multi-week attraction -> shows as an all-day item on the listed weekdays
#   tags:       feed the Discord digest's "Recommended For You" matcher (german, oktoberfest,
#               halloween, fair, festival, carnival, family, ...)

