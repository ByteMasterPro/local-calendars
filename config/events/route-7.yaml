# Route 7 Brewing events read off their Instagram (@rt7brewing).
#
# They publish no calendar: their website is menu-and-hours only, their Facebook page needs a
# login, and Instagram is where everything is announced - usually only days ahead. Their live
# music is also listed on wheresthemusic.us, which this calendar reads automatically; this file
# is for everything else (watch parties, karaoke nights, anniversary events, specials).
#
# To refresh: ask Claude to check @rt7brewing, or run `uv run localcal posters` after adding
# entries here. See CLAUDE.md, "Instagram as a source".

