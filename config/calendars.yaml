  # ------------------------------------------------------------ fairs & festivals
  - slug: fairs-festivals
    name: Fairs & Festivals near Leesburg
    kind: festival
    url: https://bytemasterpro.github.io/local-calendars/
    location: Northern Virginia
    description: Hand-curated fairs, festivals, carnivals and seasonal farm events within about an hour of Leesburg, VA.
    source:
