      file: config/events/fairs-festivals.yaml

# Weekly Discord digest (`localcal digest`, Mondays). Three sections. Each shows ONLY this week
# (run day through Sunday) in detail, then one "Next week:" line of highlights for the following
# Mon-Sun. Regexes are case-insensitive, matched against title + description + tags + calendar.
#   **Sun Sep 20**, 1–4pm — Title (Venue, Town): excerpt. Tomorrow.
digest:
  title: This week around Leesburg
  preview_limit: 5                         # highlights per "Next week:" line
  top_picks:                               # first card: the week's best, with full excerpts.
    label: "Top picks this week"           # candidates = fair one-offs + seasonal brewery events +
    limit: 5                               # town items matching `pattern`; chronological
    pattern: "fair\\b|festival|carnival|parade|fireworks|air ?show|halloween|pumpkin|oktober|german|holiday|christmas|santa|tree lighting"
  sections:
    fairs:
      label: "Fairs, Festivals and Carnivals"
      kinds: [festival]
      limit: 8                             # one-offs this week; season farms collapse into one
                                           # "Ongoing weekends" line
    breweries:
      label: "Local Breweries"
      kinds: [brewery]
      limit: 8
      exclude: "karaoke|trivia|bingo|singo|\\d+% off|% off|happy hour|appy hour|watch party|kids eat free|growler|taco tuesday|teacher tuesday|discount|football"
      seasonal:                            # matched first, by the month the digest runs in
        - months: [9, 10]
          pattern: "oktober|octoberfest|german|deutsch|prost|stein|bavarian|lederhosen|polka|accordion|halloween|haunt|spooky|costume|pumpkin|harvest|fest\\b"
        - months: [11, 12]
          pattern: "christmas|holiday|santa|tree lighting|ugly sweater|gingerbread|nutcracker|hanukkah|menorah|new year|winter|caroling|wreath"
      fill_below: 3                        # fewer seasonal picks than this -> top up with...
      fallback: "live music|concert|\\bband\\b|acoustic|bluegrass|\\bjam\\b|music"   # ...music, up to `limit`
    towns:
      label: "Town Activities"
      kinds: [town]
      limit: 8
      exclude: "council|commission|board meeting|public hearing|zoning|work session|advisory|zumba|fitness|yoga|workout"
      prioritize: "fair|festival|carnival|parade|fireworks|movie|market|kids|family|concert|halloween|pumpkin|holiday|airshow|air show|tour"
      farmers_markets:
        label: "Farmers Markets"
        pattern: "farmers'? market|farmer's market"
