      type: elfsight
      widget_id: 5cfe5396-d62a-432e-8a83-f53cb73bb713

  - slug: chilly-hollow
    name: Chilly Hollow Brewing Co.
    kind: brewery
    url: https://chillyhollowbrewingco.com/happenings
    location: Chilly Hollow Brewing Co., 669 Chilly Hollow Rd, Berryville, VA 22611
    # Their elf.site widget (801481ca-8bef-49da-9c68-dd8aa5cda35d) is fed by a public Google
    # Calendar; subscribing to that directly gives live updates and full recurrence fidelity.
    feed_url: https://calendar.google.com/calendar/ical/7a36777b804e9b9d04d70c58670135065f60a7e350d7b860f9e9c7686a9a7131%40group.calendar.google.com/public/basic.ics
    google_calendar_id: 7a36777b804e9b9d04d70c58670135065f60a7e350d7b860f9e9c7686a9a7131@group.calendar.google.com

  # The three below already publish feeds; they are here so `localcal upcoming` covers them and
  # the index page is the one place to find every subscribe URL.
  - slug: solace-sterling
    name: Solace Brewing Co. in Sterling
    kind: brewery
    url: https://www.solacebrewing.com/sterling
    location: Solace Brewing Co., 42615 Trade W Dr, Sterling, VA 20166
    feed_url: https://calendar.google.com/calendar/ical/c_81872c01230a1e2a19950379cffece76cfb4c99e93bfa5a74ef2c3c26715c165%40group.calendar.google.com/public/basic.ics
    google_calendar_id: c_81872c01230a1e2a19950379cffece76cfb4c99e93bfa5a74ef2c3c26715c165@group.calendar.google.com

  - slug: vanish
    name: Vanish Farmwoods Brewery
