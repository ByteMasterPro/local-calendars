name: Build calendar feeds

on:
  schedule:
    # Daily 10:00 UTC = 06:00 EDT / 05:00 EST. Daily (not weekly) because Leesburg's RSS only
    # shows ~2 weeks ahead, and breweries post mid-week. GitHub cron is UTC only.
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "localcal/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen

      - name: Build feeds
        run: uv run localcal build

      - name: Commit updated feeds
        run: |
          git config user.name "localcal bot"
          git config user.email "localcal-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Feeds unchanged"
          else
            git commit -m "feeds: $(date -u +%Y-%m-%d)"
            git push
          fi
