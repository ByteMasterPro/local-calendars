name: Weekly Discord digest

on:
  schedule:
    # GitHub runs cron on a best-effort queue: these have fired 4-9 hours late, and one was
    # dropped entirely, so the digest has four Monday triggers at an odd minute (the top of the
    # hour is the most contended). The first to run posts; the rest see it and stand down.
    # 06:17 UTC = 02:17 EDT, early enough that even hours of drift still lands Monday morning.
    - cron: "17 6 * * 1"
    - cron: "17 10 * * 1"
    - cron: "17 14 * * 1"
    - cron: "17 18 * * 1"
  workflow_dispatch:
    inputs:
      post:
        description: "Actually post to Discord (otherwise print a preview in the log)"
        type: boolean
        default: true
      skip_if_posted:
        description: "Stand down if this week's digest is already in the channel (what the schedules do)"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}      # bot with Manage Messages: purges the channel first
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Build and post digest
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; printing preview only"
            uv run localcal digest
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.post }}" != "true" ]; then
            uv run localcal digest
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.skip_if_posted }}" = "true" ]; then
            echo "branch: post with skip-if-posted guard"
            uv run localcal digest --post --skip-if-posted
          else
            echo "branch: post unconditionally"
            uv run localcal digest --post
          fi
