[project]
name = "brewcal"
version = "0.1.0"
description = "Turn brewery event pages into subscribable .ics calendar feeds"
requires-python = ">=3.12"
dependencies = [
    "icalendar>=7.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
brewcal = "brewcal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brewcal"]
